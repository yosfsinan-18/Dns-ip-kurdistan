<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUSEEF STORE - DNS Security</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #131a2e;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .install-btn {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }
        .install-btn:hover {
            opacity: 0.9;
        }
        /* شێوازێ هێلا بارکرنێ */
        .progress-box {
            display: none;
            margin-top: 25px;
        }
        .progress-bar-container {
            width: 100%;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            height: 12px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            transition: width 0.01s linear;
        }
        .percentage {
            margin-top: 10px;
            font-size: 16px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YUSEEF STORE</h1>
        <p>DNS Security Platform</p>
        
        <!-- دوگمکا سەرەکی -->
        <button class="install-btn" id="installBtn" onclick="startDownload()">INSTALL</button>

        <!-- پشکا بارکرنێ (0 بۆ 100 د 1 چرکەیێ دا) -->
        <div class="progress-box" id="progressBox">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="percentage" id="percentageText">0%</div>
        </div>
    </div>

    <script>
        function startDownload() {
            var btn = document.getElementById("installBtn");
            var box = document.getElementById("progressBox");
            var bar = document.getElementById("progressBar");
            var text = document.getElementById("percentageText");

            // ڤەشارتنا دوگمێ و نیشاندانا بارکرنێ
            btn.style.display = "none";
            box.style.display = "block";

            var currentPercent = 0;
            // 1 چرکە دابەش دکەین سەر 100 پشکێن بچووک (واتە هر 10 ملي ثانية تشتەک زێدە دکەت)
            var interval = setInterval(function() {
                currentPercent++;
                bar.style.width = currentPercent + "%";
                text.innerText = currentPercent + "%";

                if (currentPercent >= 100) {
                    clearInterval(interval);
                    // پشتی بوو 100%، ڕاستەوخۆ فایلا پروفایلی داکێشیت
                    window.location.href = "dns.mobileconfig";
                }
            }, 10); // 10ms * 100 = 1000ms (1 second)
        }
    </script>

</body>
</html>
